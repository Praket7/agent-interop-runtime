name: Verification Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verification-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 25
    steps:
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm mcp:validate
      - run: pnpm schema:check
      - run: pnpm bench:check
      - run: pnpm pack --pack-destination work
