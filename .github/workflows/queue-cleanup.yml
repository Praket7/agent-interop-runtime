name: Clear stale Actions queue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: agent-interop-queue-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Cancel stale queued workflow runs
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = context.runId;
            const currentSha = context.sha;
            let cancelled = 0;
            let preserved = 0;

            const pages = github.paginate.iterator(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, status: 'queued', per_page: 100 }
            );

            for await (const response of pages) {
              for (const run of response.data) {
                if (run.id === currentRunId) {
                  preserved++;
                  continue;
                }
                // Preserve the real CI for this exact commit; everything older is stale.
                if (run.head_sha === currentSha && run.name === 'CI') {
                  preserved++;
                  continue;
                }

                core.info(`Cancelling stale queued run ${run.id} (${run.name}, ${run.head_branch}, ${run.head_sha})`);
                try {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                  cancelled++;
                } catch (error) {
                  core.warning(`Normal cancel failed for ${run.id}: ${error.message}; trying force-cancel`);
                  try {
                    await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {
                      owner, repo, run_id: run.id
                    });
                    cancelled++;
                  } catch (forceError) {
                    core.warning(`Force-cancel failed for ${run.id}: ${forceError.message}`);
                  }
                }
              }
            }

            core.notice(`Queue cleanup complete: cancelled ${cancelled}, preserved ${preserved}`);
