name: Release v0.3.0 (one-shot)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.3.0-once.yml'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: 7026afbd9918fbe2d69c11833bbbdb316c5ec3f5
      RELEASE_VERSION: 0.3.0
      RELEASE_TAG: v0.3.0
    steps:
      - name: Check out exact green release candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release target and package version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$PACKAGE_VERSION" = "$RELEASE_VERSION"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full release gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm mcp:validate
          pnpm schema:check
          pnpm bench:check
          mkdir -p work
          pnpm pack --pack-destination work

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            EXISTING="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$EXISTING" = "$TARGET_SHA"
            echo "$RELEASE_TAG already points to the expected release commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Agent Interop Runtime $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Check npm release state
        id: npm_release
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED="$(pnpm view "agent-interop-runtime@${RELEASE_VERSION}" version 2>/dev/null || true)"
          if [ "$PUBLISHED" = "$RELEASE_VERSION" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to npm
        if: steps.npm_release.outputs.already_published != 'true'
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install pinned MCP publisher
        shell: bash
        env:
          MCP_PUBLISHER_VERSION: '1.8.1'
          MCP_PUBLISHER_SHA256: 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc'
        run: |
          set -euo pipefail
          URL="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error "$URL" --output mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP Registry metadata
        run: ./mcp-publisher publish

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Agent Interop Runtime $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
